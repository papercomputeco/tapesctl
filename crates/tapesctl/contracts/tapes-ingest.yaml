components:
  schemas:
    ChatResponse:
      description: |-
        ChatResponse represents a provider-agnostic chat completion response.
        This is the internal representation used by the proxy after parsing
        provider-specific response formats.
      properties:
        created_at:
          description: Response timestamp
          format: date-time
          type: string
        done:
          description: Whether generation is complete (for streaming)
          type: boolean
        extra:
          additionalProperties: {}
          description: Provider-specific fields that don't map to common parameters
          type: object
        message:
          $ref: '#/components/schemas/Message'
        model:
          description: Model that generated the response
          type: string
        raw_response:
          description: |-
            RawResponse preserves the original response payload for cases where
            parsing is incomplete or for debugging.
        stop_reason:
          description: Stop reason (e.g., "stop", "length", "tool_use", "end_turn")
          type: string
        usage:
          $ref: '#/components/schemas/Usage'
      type: object
    ContentBlock:
      description: |-
        ContentBlock represents a single piece of content within a message.
        The Type field determines which other fields are populated.
      properties:
        content:
          description: |-
            Content (type="web_search_tool_result" and other server-tool results) -
            the raw result payload Anthropic returns inline on the block, captured
            verbatim as JSON so the variable result-object shapes survive without
            imposing a schema. ToolResultID links it to the paired server_tool_use.
        image_base64:
          description: Base64-encoded image data
          type: string
        image_url:
          description: Image content (type="image")
          type: string
        is_error:
          type: boolean
        media_type:
          description: MIME type (e.g., "image/png")
          type: string
        text:
          description: Text content (type="text")
          type: string
        thinking:
          description: |-
            Thinking (type="thinking") - Anthropic extended-thinking blocks.
            Anthropic emits thinking as content_block_delta frames with type
            "thinking_delta" followed by a "signature_delta" that authenticates the
            block. Consumers treat Thinking as opaque text; the signature is persisted
            so downstream tooling can verify integrity.
          type: string
        thinking_signature:
          type: string
        tool_input:
          additionalProperties: {}
          type: object
        tool_name:
          type: string
        tool_output:
          type: string
        tool_result_id:
          description: Tool result (type="tool_result") - result from tool execution
          type: string
        tool_use_id:
          description: Tool use (type="tool_use") - assistant requesting tool execution
          type: string
        type:
          description: '"text", "image", "tool_use", "tool_result", "thinking"'
          type: string
      type: object
    ErrorResponse:
      description: ErrorResponse represents an error from the LLM API.
      properties:
        error:
          type: string
      type: object
    IngestEnvelope:
      description: |-
        IngestEnvelope is the session-tracking envelope attached to a turn
        payload at the ingest HTTP boundary. It carries identity fields
        (org_id, auth_subject) plus the harness identifiers ingest uses to
        resolve a `sessions` row.

        IngestEnvelope is held in pkg/sessions (rather than the `ingest`
        package itself) so both the HTTP handler in `ingest` and the
        session-aware worker code under `proxy/worker` can reference the
        same type without inverting the existing import graph
        (proxy/worker is a dependency of ingest, not the other way around).

        Field semantics:

          - OrgID, AuthSubject: identity fields; MUST be set on every
            non-nil envelope. Empty values are not synthesized — they
            are persisted verbatim so the row stays attributable.
          - HarnessID: "claude" | "unknown" | other registered harness;
            empty is normalized to "unknown".
          - HarnessSessionID: opaque identifier for the harness session.
            REQUIRED when HarnessID != "unknown". When absent (or when
            HarnessID == "unknown"), ingest derives a synthetic id from
            the captured turn's Merkle root prefix.
          - ParentHarnessSessionID: fork-lineage hint, resolved server-side
            to the parent's `sessions.id` within this envelope's harness
            namespace. Parent and child are assumed to share a harness_id;
            cross-harness forks are not supported (the envelope carries no
            parent harness_id). When the parent's first turn hasn't landed
            yet, ingest placeholder-inserts the parent so the FK can be set.
          - HarnessMetadata: arbitrary JSON object merged into the
            `sessions.harness_metadata` column last-write-wins per key.
      properties:
        auth_subject:
          type: string
        cwd:
          type: string
        harness_id:
          type: string
        harness_metadata: {}
        harness_session_id:
          type: string
        harness_version:
          type: string
        name:
          type: string
        org_id:
          type: string
        parent_harness_session_id:
          type: string
      type: object
    Message:
      description: |-
        Message represents a single message in a conversation.
        Content is stored as an array of ContentBlocks to support multimodal content
        (text, images, tool use, etc.) in a provider-agnostic way.
      properties:
        content:
          description: Array of content blocks
          items:
            $ref: '#/components/schemas/ContentBlock'
          type: array
        role:
          description: '"system", "user", "assistant", "tool"'
          type: string
      type: object
    TranscriptPayload:
      description: |-
        TranscriptPayload is the ingest body for one harness transcript file
        — the main session transcript or one subagent's. The records land in
        the immutable raw layer verbatim (source: transcript); the deriver
        reconciles them against the wire capture to recover the causal/fork
        skeleton. No node-path processing happens at ingest time.
      properties:
        agent_id:
          description: |-
            AgentID is empty for the main transcript, or the subagent id for
            subagents/agent-<id>.jsonl files.
          type: string
        agent_type:
          description: |-
            AgentType / Description / ToolUseID mirror the harness's
            subagent meta.json: ToolUseID is the Task tool_use that forked
            this agent — the causal fork edge the deriver attaches.
          type: string
        description:
          type: string
        kind:
          description: |-
            Kind qualifies Codex sub_agent_activity anchor rows:
            "interacted" marks a re-entry record (send_message /
            followup_task, targeting AgentID with ToolUseID = the triggering
            call), banked for future rendering and ignored by derivation.
            Absent/empty means spawn evidence — the legacy default.
          type: string
        records:
          description: |-
            Records is the transcript's JSONL content as a JSON array,
            verbatim.
        session:
          $ref: '#/components/schemas/IngestEnvelope'
        tool_use_id:
          type: string
      type: object
    TurnMeta:
      description: |-
        TurnMeta mirrors the capture adapter's meta block (tapes-extproc
        TurnMeta). Every field is optional; adapters that predate a field
        simply omit it. Ingest only reads RequestID directly (raw-turn
        dedup) — the rest ride along verbatim in the raw layer and become
        queryable post-derive.
      properties:
        captured_at:
          description: |-
            CapturedAt is the capture-side instant the turn COMPLETED
            upstream, RFC 3339 — the quantity CreatedAt actually means, and
            the one a producer that reduces live records as time.Now().

            Distinct from TsRequest by exactly the call's duration. Preferred
            over it because it needs no arithmetic to be exact; optional, and
            no released producer sends it yet. See stampCaptureTime for the
            precedence and what happens when neither field is present.
          type: string
        content_encoding:
          type: string
        content_type:
          type: string
        elapsed_seconds:
          format: double
          type: number
        endpoint:
          type: string
        method:
          type: string
        model:
          type: string
        model_family:
          type: string
        path:
          type: string
        request_bytes:
          format: int32
          type: integer
        request_id:
          type: string
        response_bytes:
          format: int32
          type: integer
        stream:
          type: string
        thread_id:
          description: |-
            ThreadID is the harness sub-thread id resolved by the capture
            adapter (extproc headers.ThreadID); "" for main-thread calls.
          type: string
        ts_request:
          description: |-
            TsRequest is the capture-side instant the turn's request went
            upstream, RFC 3339. It is not new: pkg/backfill emits it and
            derive.CapturedAt already reads it as a row's original capture
            time, which is where every derived span's StartedAt comes from.
            Ingest parses it here so a server-side reduction can date itself
            from the same source the deriver uses, rather than a second,
            silently different clock.
          type: string
        upstream_status:
          format: int32
          type: integer
        upstream_status_class:
          type: string
      type: object
    TurnPayload:
      description: |-
        TurnPayload is the ingest request body for a single completed conversation turn.
        It carries the raw provider request plus an already-reduced response.
        Capture adapters such as tapes-extproc own protocol-specific stream reduction;
        ingest owns request parsing, validation, and durable storage.
      properties:
        agent_name:
          description: AgentName optionally tags the turn (same as X-Tapes-Agent-Name
            header)
          type: string
        meta:
          $ref: '#/components/schemas/TurnMeta'
        provider:
          description: 'Provider type: "openai", "anthropic", "ollama"'
          type: string
        raw_response:
          description: |-
            RawResponse is the upstream response body exactly as it arrived on the
            wire, base64-encoded in the JSON envelope. Optional and independent of
            Response: an adapter may send both (reduction plus the bytes it reduced
            from), only the reduction (the historical shape), or only the bytes.

            Raw-only is the interesting case. Reduction is lossy and adapter-
            specific, so an adapter that ships only the bytes lets ingest perform
            the reduction with the shared pkg/capture reducers — which is what makes
            two capture paths produce identical rows for identical upstream traffic
            instead of two subtly different ones.
          format: byte
          type: string
        raw_response_encoding:
          description: |-
            RawResponseEncoding is the Content-Encoding of RawResponse ("identity",
            "gzip", …). Empty means identity. The bytes are stored under this
            encoding rather than decompressed, so the stored column stays literally
            what the upstream sent.
          type: string
        raw_response_withheld:
          description: |-
            RawResponseWithheld says the producer captured verbatim bytes and
            deliberately did not send them — almost always because including them
            would have pushed the envelope past MaxIngestBodyBytes, so the choice
            was between a turn without its bytes and no turn at all.

            Without it that turn is indistinguishable from one produced by an
            adapter that never captured raw bytes in the first place: both arrive
            with raw_response absent. Those are opposite facts. The first is a
            limit that bit and wants tuning; the second is a deployment fact about
            which producers are running. A fidelity report that cannot separate
            them reports the wrong one — silently, and in the reassuring
            direction, since "this producer doesn't send raw" reads as expected
            where "we lost bytes we had" does not.

            Deliberately NOT named to match the raw_response_dropped column it
            feeds. The column is the union of two causes — the producer withheld,
            or ingest capped — and this field is only one of them. A shared name
            would imply the producer sets the column, when it contributes to it.

            Absent means "no claim", which is exactly the pre-existing behavior:
            every producer shipped before this field omits it and keeps reading as
            it always did.
          type: boolean
        request:
          description: RawRequest is the original request body sent to the LLM provider.
        response:
          $ref: '#/components/schemas/ChatResponse'
        session:
          $ref: '#/components/schemas/IngestEnvelope'
      type: object
    Usage:
      description: Usage contains token counts and timing information.
      properties:
        cache_creation_input_tokens:
          description: Cache token counts (Anthropic prompt caching)
          format: int32
          type: integer
        cache_read_input_tokens:
          format: int32
          type: integer
        completion_tokens:
          format: int32
          type: integer
        prompt_duration_ns:
          description: |-
            PromptDurationNs is provider-reported prompt-evaluation time, in
            nanoseconds. Populated by providers that surface it (currently Ollama
            only); left at zero otherwise.
          format: int64
          type: integer
        prompt_tokens:
          description: Token counts
          format: int32
          type: integer
        total_duration_ns:
          description: |-
            TotalDurationNs is the proxy-measured wall-clock time, in nanoseconds,
            from when the proxy received the client request to when the upstream
            response was fully assembled. Set uniformly by the proxy across providers
            — Anthropic and OpenAI don't surface a duration field on the wire, and
            Ollama's server-internal `total_duration` is intentionally overwritten so
            aggregate stats compare apples to apples.
          format: int64
          type: integer
        total_tokens:
          format: int32
          type: integer
      type: object
    ingestAcceptedResponse:
      description: |-
        ingestAcceptedResponse acknowledges a turn that reached the raw layer.

        The write is acknowledged, not completed: 202 means the turn was captured and
        queued, and the derived projection follows asynchronously.
      properties:
        status:
          description: Status is "accepted" when the turn reached the raw layer.
          example: accepted
          type: string
      type: object
    pingResponse:
      description: pingResponse is the liveness probe body.
      properties:
        status:
          description: Status is "ok" when the process is serving.
          example: ok
          type: string
      type: object
    transcriptAcceptedResponse:
      description: |-
        transcriptAcceptedResponse acknowledges one transcript file.

        Deduped reports that this exact content version was already stored, which is
        the normal result of re-uploading an unchanged transcript — a success, not a
        no-op to retry.
      properties:
        agent_id:
          description: |-
            AgentID names the subagent whose transcript this is, empty for the main
            session file.
          type: string
        deduped:
          description: Deduped reports that this exact content version was already
            stored.
          type: boolean
        records:
          description: Records is the number of transcript records in the uploaded
            file.
          format: int32
          type: integer
        status:
          description: Status is "accepted" when the transcript reached the raw layer.
          example: accepted
          type: string
      type: object
info:
  description: |-
    Write surface for captured LLM turns and harness transcripts.

    Capture adapters (tapes-extproc, tapesctl, paperd) POST completed turns here; the server appends them to the immutable raw-turn log and the deriver projects them into sessions, traces, and spans.

    **Not internet-facing.** These endpoints trust the org identity in the request envelope, so the only legitimate caller is an in-cluster capture adapter. Exposing them through an edge gateway would let any JWT holder write turns under an arbitrary org.
  title: Tapes Ingest API
  version: "1.0"
openapi: 3.0.3
paths:
  /ping:
    get:
      description: Reports that the ingest server is up. Does not check the database
        — a 200 here means the process is serving, not that a write would succeed.
      operationId: ingestPing
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pingResponse'
          description: The server is serving
      summary: Liveness probe
      tags:
      - health
  /v1/ingest:
    post:
      description: |-
        Appends one completed LLM turn to the immutable raw-turn log. The raw envelope is persisted BEFORE parsing, so a turn that fails provider parsing is still captured and a later parser fix re-derives it rather than needing a re-capture.

        Idempotent when the adapter supplies meta.request_id: a retried POST of the same captured turn dedupes at the raw layer instead of appending twice.

        The response may carry a reduced response, the verbatim upstream bytes (raw_response), or both. Raw-only is reduced server-side with the shared reducers, which is what lets two capture paths produce identical rows for identical traffic.
      operationId: ingestTurn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnPayload'
        description: Captured turn
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingestAcceptedResponse'
          description: Captured and queued for derivation
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Malformed envelope or invalid session block
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Well-formed but unprocessable (e.g. unknown provider)
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A downstream dependency failed
      summary: Ingest one captured turn
      tags:
      - ingest
  /v1/ingest/transcript:
    post:
      description: |-
        Appends one harness transcript — the main session file or a single subagent's — to the raw layer verbatim. The deriver reconciles the records against the wire capture to recover the causal and fork skeleton; no node-path processing happens here.

        Idempotent per content version: the dedup key includes a content hash, so re-uploading an unchanged file is a no-op (deduped=true) while a transcript that has grown appends a new version. The deriver reads the latest version per session and agent.
      operationId: ingestTranscript
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptPayload'
        description: Transcript file and its harness metadata
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transcriptAcceptedResponse'
          description: Stored, or already present as this content version
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Malformed body, invalid session block, or records not a JSON
            array
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Persisting the transcript failed
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Driver does not host the raw-turn layer
      summary: Ingest one harness transcript file
      tags:
      - ingest
