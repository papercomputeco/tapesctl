[package]
name = "tapesctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "tapesctl"
path = "src/lib.rs"

[[bin]]
name = "tapesctl"
path = "src/main.rs"

[dependencies]
tapes-harnesses = { workspace = true }
arc-swap = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
snafu = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# Only macOS needs it, and only to read a PID's parent: there is no `/proc` to
# parse, and `proc_pidinfo` is the supported query. The shared crate reaches for
# the same call, at the same pinned version, for its own per-PID lookups.
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
test-case = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
