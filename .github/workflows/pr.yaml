name: Check PR

# See the header of ci.yaml for why `runs-on` is a fork-aware expression.
#
# The two checks below are deliberately not treated the same for a fork.
# A conventional title is something any contributor can supply, so it stays
# enforced. A Linear magic word cannot be: the issue tracker it names is not
# readable — let alone writable — from outside the organisation, so demanding
# one would be a gate an external contributor has no way to pass.
#
# Dependabot is exempt from both checks. Dependency bumps are machine-authored;
# the title and Linear policies exist to keep human and agent PRs honest, and a
# bot cannot be asked to follow either. The exemption is a step-level `if:`
# that succeeds with a notice rather than a job-level skip, for the same
# reason the fork branch below is: a skipped job reports "skipped", and
# whether that satisfies a required status check depends on branch-protection
# configuration — a dependency worth not having.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

env:
  DAGGER_VERSION: "0.21.7"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-title:
    name: Check PR Title
    runs-on: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'depot-ubuntu-24.04' }}

    steps:
      - name: Note that the title check does not apply to Dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          echo "PR title check waived: dependency bumps are machine-authored;" \
               "the title policy is for human/agent PRs."
          {
            echo "### PR title: not required"
            echo
            echo "This pull request was opened by Dependabot. Dependency bumps"
            echo "are machine-authored; the title policy is for human and"
            echo "agent pull requests."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/checkout@v4

      - name: Install Dagger
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Check PR title conformance
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          dagger call -m github.com/papercomputeco/daggerverse/ghcontrib \
              --token=env://GH_TOKEN \
              --repo="${{ github.repository }}" \
            check-pull-request \
              --number "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  check-linear-magic-word:
    name: Check Linear Magic Word
    runs-on: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'depot-ubuntu-24.04' }}

    # The fork and Dependabot branches are step-level `if:`s inside one job
    # rather than job-level `if:`s, so this check reports the same name and a
    # real conclusion on every pull request. A job skipped by a job-level `if:`
    # reports "skipped", and whether that satisfies a required status check
    # depends on branch-protection configuration — a dependency worth not
    # having.
    steps:
      - name: Note that the Linear check does not apply to Dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          echo "Linear magic word check waived: dependency bumps are" \
               "machine-authored; the policy is for human/agent PRs."
          {
            echo "### Linear magic word: not required"
            echo
            echo "This pull request was opened by Dependabot. Dependency bumps"
            echo "are machine-authored; the Linear policy is for human and"
            echo "agent pull requests."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Note that the Linear check does not apply to forks
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo "### Linear magic word: not required"
            echo
            echo "This pull request comes from a fork, so the Linear issue"
            echo "reference this check normally enforces is not expected."
            echo "Maintainers link the issue when they triage the change."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4

      - name: Install Dagger
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Check Linear magic word
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          dagger call -m github.com/papercomputeco/daggerverse/ghcontrib \
              --token=env://GH_TOKEN \
              --repo="${{ github.repository }}" \
            check-pull-request-linear-magic-word \
              --number "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
