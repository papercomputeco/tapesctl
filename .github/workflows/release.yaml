name: Release

on:
  release:
    types: [published]

env:
  DAGGER_VERSION: "0.21.7"

jobs:
  release:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: ${{ env.DAGGER_VERSION }}

      # `--version` and `--commit` are what a released binary answers
      # `tapesctl version` with. They have to be passed in: the Dagger module
      # builds from a source directory with no `.git` in it, so nothing inside
      # the build can work out which tag or commit it is compiling.
      #
      # This step publishes. `release-latest` syncs to the download prefixes
      # `install.sh` reads, and it asks the built binary who it is before it
      # syncs anything — so a build that lost its identity fails here with
      # nothing uploaded, rather than being caught by a later step that can no
      # longer take it back.
      #
      # It also publishes `install.sh` itself, inside the same call. The
      # installer and the artifacts it fetches move together: there is no
      # separate step to skip or to fail after the binaries are already
      # public, so a green release means the served installer matches the
      # release it just cut.
      - name: Build and upload release artifacts
        run: |
          dagger call \
            release-latest \
              --version="${{ github.event.release.tag_name }}" \
              --commit="${{ github.sha }}" \
              --endpoint=env://BUCKET_ENDPOINT \
              --bucket=env://BUCKET_NAME \
              --access-key-id=env://BUCKET_ACCESS_KEY_ID \
              --secret-access-key=env://BUCKET_SECRET_ACCESS_KEY \
            export \
              --path=./build
        env:
          BUCKET_ENDPOINT: ${{ secrets.BUCKET_ENDPOINT }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          BUCKET_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_ACCESS_KEY }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      # A second opinion, not the gate. The gate is inside the pipeline above,
      # which is the only place the artifacts are still private; by the time
      # this runs they are already on the download host. What it adds is a
      # check written a different way — reading the exported files, through the
      # `version` command rather than the flag — over the same artifacts the
      # step below attaches to the GitHub release. If it ever disagrees with
      # the pipeline, the export is what is wrong.
      #
      # The Linux amd64 binary is the one this runner can execute; the four are
      # produced by one build with one set of variables, so it stands for all
      # of them.
      - name: Exported binaries still report the tag they were released under
        env:
          TAG: ${{ github.event.release.tag_name }}
          COMMIT: ${{ github.sha }}
        run: |
          chmod +x ./build/linux/amd64/tapesctl
          ./build/linux/amd64/tapesctl version | tee version.txt
          grep -qx "tapesctl ${TAG}+${COMMIT:0:7}" version.txt
          grep -qx "Sha: ${COMMIT}" version.txt

      - name: Upload artifacts to GitHub release
        run: |
          mkdir -p dist
          for file in $(find build -type f); do
            rel_path="${file#build/}"
            os=$(dirname "$rel_path" | cut -d'/' -f1)
            arch=$(dirname "$rel_path" | cut -d'/' -f2)
            filename=$(basename "$file")

            if [[ "$filename" == *.sha256 ]]; then
              base="${filename%.sha256}"
              binary_name="${base}-${os}-${arch}"
              new_name="${binary_name}.sha256"
              checksum=$(cut -d' ' -f1 "$file")
              printf '%s  %s\n' "$checksum" "$binary_name" > "dist/$new_name"
            else
              new_name="${filename}-${os}-${arch}"
              cp "$file" "dist/$new_name"
            fi
          done

          gh release upload "${{ github.event.release.tag_name }}" dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
