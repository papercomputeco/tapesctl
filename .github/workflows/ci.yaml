name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DAGGER_VERSION: "0.21.7"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Test
    runs-on: depot-ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Lint (cargo fmt --check + clippy)
        run: dagger call lint
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Test (cargo test --workspace)
        run: dagger call test
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  build:
    name: Build
    runs-on: depot-ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cross-compile all targets via Dagger
        uses: dagger/dagger-for-github@v8.2.0
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        with:
          verb: call
          args: build export --path=./build
          version: ${{ env.DAGGER_VERSION }}

      - name: Upload darwin arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-binaries
          path: build/darwin/arm64/
          retention-days: 1

      - name: Upload darwin amd64 binary
        uses: actions/upload-artifact@v4
        with:
          name: darwin-amd64-binaries
          path: build/darwin/amd64/
          retention-days: 1

      - name: Upload linux amd64 binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-binaries
          path: build/linux/amd64/
          retention-days: 1

      - name: Upload linux arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-binaries
          path: build/linux/arm64/
          retention-days: 1

  smoke:
    name: Smoke Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS 15 (arm64)
            runner: macos-15
            artifact: darwin-arm64-binaries
          - os: macOS 15 (amd64)
            runner: macos-15-intel
            artifact: darwin-amd64-binaries
          - os: Linux (amd64)
            runner: depot-ubuntu-24.04
            artifact: linux-amd64-binaries
          - os: Linux (arm64)
            runner: depot-ubuntu-24.04-arm
            artifact: linux-arm64-binaries

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./bin

      - name: Run canary
        run: |
          chmod +x ./bin/tapesctl
          test "$(./bin/tapesctl)" = "All in all, just another tape in the stereo"
