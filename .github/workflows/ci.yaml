name: CI

# A pull request from a fork gets no secrets and no access to this org's paid
# runner pool. Two consequences are handled throughout this file:
#
#   * `runs-on` falls back to a GitHub-hosted runner. A job that asks for a
#     Depot label it cannot be given does not fail — it queues until it times
#     out hours later, which reads to a contributor as "CI is stuck", so the
#     fallback is what makes fork CI report at all.
#   * `secrets.DAGGER_CLOUD_TOKEN` interpolates to the empty string, which
#     Dagger treats as "no cloud account" rather than as a bad credential.
#     Builds run; they just publish no cloud trace.
#
# The fork test is spelled out rather than factored into `env`, because the
# `env` context is not available to `runs-on`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DAGGER_VERSION: "0.21.7"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Test
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || 'depot-ubuntu-24.04' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Lint (cargo fmt --check + clippy)
        run: dagger call lint
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Test (cargo test --workspace)
        run: dagger call test
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  freshness:
    name: Vendored Corpus Freshness
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || 'depot-ubuntu-24.04' }}

    # This repository vendors two things it does not author: the tapes ingest
    # contract and two shared fixture corpora. Both carry their own provenance
    # (PROVENANCE.md fingerprints, SOURCE.md pins) and both ship a checker —
    # and until this job existed, no workflow ran either. The consequence was
    # specific rather than theoretical: a vendored copy that had been edited
    # consistently, cases and seal together, passed every gate. The suite only
    # ever asked whether the copy agreed with itself.
    #
    # Not a Dagger job, unlike lint/test. These checks are bash, git, curl and
    # shasum against an external source of truth; containerising them would add
    # an engine to the critical path without changing what is verified. They
    # need only public network access, which a fork runner also has, so the job
    # reports on fork pull requests too.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ingest contract matches the published release asset
        # STRICT turns "could not reach the release asset" into a failure. The
        # default (a notice, and a pass on gate 1 alone) is for offline work:
        # here it would mean the job's green tick attested only that the
        # vendored file matches a fingerprint recorded in the same commit, so
        # a change touching both would sail through.
        run: make contracts-check
        env:
          TAPES_CONTRACTS_STRICT: "1"

      - name: Vendored fixture corpora match their pinned upstream commits
        # Fetches each corpus's pinned commit (SOURCE.md) from the public tapes
        # repository and runs that corpus's own `--check`. Pinned rather than
        # tip-of-branch on purpose: this gate must not go red because somebody
        # edited fixtures in another repository.
        run: make freshness-check

  pins:
    name: Tapes Crate Pins
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || 'depot-ubuntu-24.04' }}

    # The shared tapes crates are several packages from one repository, pinned
    # by revision. This asserts they are pinned as one — the same revision in
    # Cargo.toml, the same revision resolved in Cargo.lock — and that the
    # revision has actually landed on the crates repository's default branch. A
    # pin that never landed builds here out of a cached checkout and builds
    # nowhere else, which is a failure this repository can only discover from
    # someone else's clone.
    #
    # No credentials, by construction: the crates repository is public, so the
    # whole check is this checkout plus an anonymous clone of a public URL.
    # That is what makes it reportable on fork pull requests, and it is why the
    # check lives in each consumer rather than upstream — asked from up there,
    # the same question needs a token for every private consumer, which is the
    # shape that made an earlier version of it permanently red.
    #
    # Not a Dagger job, for the same reason as the freshness job above: bash and
    # git against an external source of truth, where an engine would add to the
    # critical path without changing what is verified.
    #
    # The runner's preinstalled Rust is enough: the check reads the pins with
    # `cargo metadata --no-deps`, which parses the manifest and resolves
    # nothing, so there is no toolchain to set up and nothing to cache.
    steps:
      # Pinned by commit rather than by tag. A tag is a moving pointer the
      # action's own repository can repoint, so `@v4` is an instruction to run
      # whatever that repository says v4 means at the moment this job starts —
      # and this job runs `make` against a checkout, so what it checks out is
      # the whole of what it verifies. The comment records which tag the SHA
      # was v4.4.0 at the time of pinning, because a bare SHA answers "is this
      # current?" for nobody.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tapes crate pins agree and name a landed revision
        run: make check-tapes-pins

  build:
    name: Build
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || 'depot-ubuntu-24.04' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cross-compile all targets via Dagger
        uses: dagger/dagger-for-github@v8.2.0
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        with:
          verb: call
          args: build export --path=./build
          version: ${{ env.DAGGER_VERSION }}

      - name: Upload darwin arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-binaries
          path: build/darwin/arm64/
          retention-days: 1

      - name: Upload darwin amd64 binary
        uses: actions/upload-artifact@v4
        with:
          name: darwin-amd64-binaries
          path: build/darwin/amd64/
          retention-days: 1

      - name: Upload linux amd64 binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-binaries
          path: build/linux/amd64/
          retention-days: 1

      - name: Upload linux arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-binaries
          path: build/linux/arm64/
          retention-days: 1

  smoke:
    name: Smoke Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && matrix.fork_runner || matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        # `fork_runner` is the GitHub-hosted equivalent used when the pull
        # request comes from a fork. The macOS rows already run on hosted
        # runners, so for them the two labels are deliberately the same.
        include:
          - os: macOS 15 (arm64)
            runner: macos-15
            fork_runner: macos-15
            artifact: darwin-arm64-binaries
          - os: macOS 15 (amd64)
            runner: macos-15-intel
            fork_runner: macos-15-intel
            artifact: darwin-amd64-binaries
          - os: Linux (amd64)
            runner: depot-ubuntu-24.04
            fork_runner: ubuntu-24.04
            artifact: linux-amd64-binaries
          - os: Linux (arm64)
            runner: depot-ubuntu-24.04-arm
            fork_runner: ubuntu-24.04-arm
            artifact: linux-arm64-binaries

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./bin

      - name: Run canary
        run: |
          chmod +x ./bin/tapesctl
          # The canary lives in `version` now.
          ./bin/tapesctl version > canary.txt
          test "$(tail -n 1 canary.txt)" = "All in all, just another tape in the stereo"
          # The other half of what a freshly built binary has to prove: a bare
          # invocation answers with its help, exiting 2 — clap's code for "I
          # printed help instead of running". Both halves are asserted: the
          # status is captured rather than discarded, so a binary that printed
          # the right text with the wrong exit code still fails the smoke.
          set +e
          ./bin/tapesctl > bare.txt 2>&1
          bare_status=$?
          set -e
          test "$bare_status" -eq 2
          grep -q '^Usage: tapesctl' bare.txt
