[workspace]
resolver = "2"
members = [
    "crates/tapesctl",
]

# Dual-licensed under MIT OR Apache-2.0 — see LICENSE-MIT and LICENSE-APACHE.
# The same pair the shared harness crates carry, so a consumer vendoring both
# reasons about one license, not two.
#
# `publish` stays false until the first deliberate crates.io release; flip it
# together with that release PR. It is no longer a guard against publishing an
# unlicensed crate — that reason expired with the license above — only against
# publishing before anyone has decided to.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
authors = ["Paper Compute"]
repository = "https://github.com/papercomputeco/tapesctl"

# Third-party deps are pinned here as a catalog; per-crate Cargo.toml files
# inherit a pin via `dep.workspace = true` and may add `features = [...]`
# locally. Entries a crate does not yet reference are still catalogued so the
# proxy/attribution work lands with the versions already agreed — mirrors the
# convention in the daemon client's workspace.
[workspace.dependencies]
# --- shared client-side crates (their own repo since the split) ---
# Session attribution, launch recipes, transcript discovery, and the
# X-Tapes-* envelope live in the tapes-crates repository (named
# tapes-harnesses until it grew past harness knowledge), consumed by both
# tapesctl and the daemon client so the two capture paths cannot drift apart.
# Pinned by revision like any other vendored contract.
#
# Every entry below is the same repository, at the SAME rev, spelled with the
# SAME URL — and all three properties are load-bearing.
#
# Same rev: they had drifted apart once — one entry sat several commits behind
# another's pin — which meant one repository was vendored twice at two
# different points in its history. That is worth avoiding on its own, and it
# had a concrete cost: the peer-socket rescan fix (harnesses #13) was in the
# newer rev only, so tapesctl's proxy still failed closed on a first-scan miss
# and the capture suite flaked under parallel load.
#
# Same URL: Cargo keys a git source on the URL string, not on what it resolves
# to. Spelling the old name for some entries and the new one for others would
# make one repository two sources, so a type one crate returned would stop
# being the same type another accepted — a type error whose message names two
# identical-looking types.
#
tapes-harnesses = { git = "https://github.com/papercomputeco/tapes-crates", rev = "b81abe24b5622c97fcd4f421401c577b106934b3" }

# The harness-agnostic half of capture — the X-Tapes-* envelope, the
# capture-gateway environment contract, and the peer-trust ancestry check — in
# its own crate since the dependency inversion. tapesctl consumes it directly
# rather than through a re-export: the envelope and the peer check are protocol,
# and reaching them through the harness registry would say they were harness
# knowledge. Same repository, same rev as the crates above, for the reasons
# given there.
tapes-capture = { git = "https://github.com/papercomputeco/tapes-crates", rev = "b81abe24b5622c97fcd4f421401c577b106934b3" }

# One client for the whole tapes read surface: the vendored `tapes-api.yaml`
# with its provenance and seal check, the reduction of any OpenAPI document
# into an operation table, the request assembly that follows, the
# operation-coverage gate, the discovered cassette surface (discovery decode,
# the on-disk surface cache, clap command synthesis), and the transport seam
# both surfaces call through.
#
# This was two dependencies — a read-contract crate and a cassette-client crate
# — and the split cost exactly what a split of one API into two clients costs:
# two error vocabularies for one server, two spellings of a URL failure, and a
# non-success status that was rich on one side and absent on the other. They
# are one crate upstream now, and one entry here.
#
# What did NOT move is `EXPOSED_OPERATIONS` / `UNEXPOSED_OPERATIONS`: those
# describe this CLI's surface, and a shared table would make the gate report on
# the union of two clients and stop protecting whichever one differs. See
# `src/api/contract.rs`.
#
# Both features are named rather than left to the crate's defaults, because
# each is load-bearing here and a default is not a promise. `cli` is the
# synthesis of clap commands from a *discovered* surface — tapesctl's own nouns
# are derive-generated and need nothing from it, but `tapesctl cassettes ...`
# is built at runtime from a document this binary has never seen, which is the
# one surface that cannot be written by hand. `direct-http` is `DirectHttp`,
# the no-redirect transport this CLI talks to a tapes server with.
#
# Same repository, same rev, same URL as the crates above, for the reasons
# given there.
tapes-client = { git = "https://github.com/papercomputeco/tapes-crates", rev = "b81abe24b5622c97fcd4f421401c577b106934b3", features = [
  "cli",
  "direct-http",
] }

# --- CLI ---
# `string` lets a Command/Arg be named by an owned String rather than only by a
# `&'static str`. The generated cassette surface is built from a document fetched
# at runtime, so every one of its names is owned; without this feature that
# surface cannot be expressed at all.
clap = { version = "4", features = ["derive", "env", "string"] }
anstream = "1"
anstyle = "1"

# --- async runtime ---
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
bytes = "1"

# --- HTTP (JIT proxy + API client) ---
# reqwest is built WITHOUT any compression feature on purpose. With one
# enabled it transparently decompresses a `Content-Encoding: gzip` response
# and strips the header — which would silently break two invariants at once:
# the proxy would hand the harness bytes that no longer match the encoding it
# forwarded, and the captured `raw_response` would no longer be the verbatim
# upstream bytes. Passing the encoded bytes through untouched, and telling
# ingest which encoding they are in, keeps both honest. The daemon client omits
# it for the same reason.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "json"] }
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
base64 = "0.22"
percent-encoding = "2"

# --- content-encoding (capture-side decode only) ---
# These decode the CAPTURE COPY of a request body; nothing forwarded is ever
# touched (see the reqwest comment above, which is about the opposite hazard).
# The set of encodings is deliberately the set the Go capture path decodes —
# gzip and zstd — because a body one path can read and the other cannot is a
# silent capture gap, which is exactly how zstd Codex traffic went unrecorded.
#
# flate2 rides its default pure-Rust backend: no C, and the release build cross
# compiles four targets. zstd does compile vendored C, which is the price of
# matching libzstd's behaviour rather than approximating it.
flate2 = "1"
zstd = "0.13"
url = { version = "2", features = ["serde"] }

# --- config / serde ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is archived upstream, but it is the workspace-standard YAML reader
# (the daemon client pins the same 0.9), and it parses exactly one kind of input
# here: the vendored tapes contract documents, which are compile-time constants
# embedded with `include_str!` — never untrusted data.
serde_yaml = "0.9"
toml = "0.8"
# The *writer* for `~/.tapes/config.toml`, where `toml` above is the reader.
#
# Two crates for one file needs a reason, and it is that they answer different
# questions. `toml` deserializes a document into a model, which is exactly right
# for reading and exactly wrong for writing: serializing the model back emits
# only what the model has fields for, so a `config set` from an older build
# would delete every key a newer one had written — and would flatten the user's
# comments and ordering while it was at it. toml_edit keeps the parsed document
# and edits one key in place, so everything it does not understand survives
# untouched. Already in the tree as a transitive dependency of `toml`, so this
# pin costs no new download.
toml_edit = "0.22"

# --- errors ---
snafu = "0.8"

# --- logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- attribution (session watchers, peer-PID lookup) ---
# Versions match the daemon client's workspace, which these modules were
# extracted from, so its lockfile does not fork when it switches to this crate.
arc-swap = "1"
libc = "0.2"
netsock = "0.7"

# --- misc ---
dirs = "5"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

# --- test ---
# Recomputing the vendored fixture corpora's DIGEST seals, which is how a stale
# or hand-edited vendored copy fails in this repo's CI rather than silently
# testing cases nobody upstream still has. Test-only: nothing shipped hashes.
sha2 = "0.10"
tempfile = "3"
test-case = "3"
wiremock = "0.6"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# libproc 0.14.11 gates binding generation on `#[cfg(target_os = "macos")]` in
# its build script. Build-script cfg reflects the HOST, not the target, so
# cross-compiling Linux -> *-apple-darwin runs the empty branch and never writes
# `osx_libproc_bindings.rs` — yet lib.rs, compiled *for* macOS, still
# `include!`s it. Native macOS builds work, which is why this only breaks CI.
#
# Downloading an Apple SDK does not help: the branch does not execute on a Linux
# host at all, and it hardcodes an `-I /Library/Developer/CommandLineTools/...`
# include path rather than consulting SDKROOT.
#
# This rev gates on `CARGO_CFG_TARGET_OS` (the target) and falls back to the
# bindings libproc already ships for docs.rs — no libclang, no SDK headers, so
# the zigbuild toolchain is untouched. The daemon client pins the identical rev
# for the identical reason. Drop both when a release carries the fix; 0.14.11 is
# still the newest as of this pin. Upstream: andrewdavidmackenzie/libproc-rs#168.
#
# Reached via `tapes-harnesses -> netsock -> libproc`.
[patch.crates-io]
libproc = { git = "https://github.com/andrewdavidmackenzie/libproc-rs.git", rev = "9e079f3308182bb3a47fe509571d38fb4fd380f3" }
